<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Gestão Documental - Operacional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
        /* --- DESIGN SYSTEM ORIGINAL (MANTIDO) --- */
        :root {
            --cor-principal: #27AE61;
            --cor-secundaria: #297FB8;
            --cor-off: #7E8C8D;
            --cor-borda: #e0e0e0;
            --cor-fundo: #ffffff;
            --cor-bg-body: #f0f2f5;
            --cor-bg-item: #f8f9fa;
            --cor-hover: rgba(41, 127, 184, 0.08);
            --cor-erro: #EB5757;
            --cor-alerta: #F2994A;
        }

        /* --- CSS ESTRUTURAL --- */
        body {
            background-color: #2c3e50;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .work-card {
            width: 100%;
            height: 100%;
            background: var(--cor-fundo);
            padding: 20px 15px;
            position: relative;
            animation: fadeIn 0.4s ease;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* AJUSTE VISUAL: PROGRESSO MAIS COMPACTO */
        .segmented-progress-wrapper {
            width: 100%;
            margin-bottom: 5px;
        }

        .segments-container {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 8px;
            margin-bottom: 5px;
        }

        .segment {
            height: 4px;
            background-color: #f0f0f0;
            flex-grow: 1;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .segment.completed {
            background-color: var(--cor-principal);
            opacity: 0.6;
        }

        .segment.active {
            height: 5px;
            flex-grow: 3;
            background-color: var(--cor-principal);
            opacity: 1;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .step-name-display {
            font-size: 11px;
            font-weight: 700;
            color: var(--cor-off);
            text-transform: uppercase;
        }

        .step-counter {
            font-size: 11px;
            color: var(--cor-off);
            font-weight: 700;
        }

        h4 {
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 6px;
            font-size: 20px;
        }

        /* INPUTS E BOTÕES */
        .input-rounded {
            width: 100%;
            border: 1px solid var(--cor-borda);
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
        }

        .input-rounded:focus {
            outline: none;
            border-color: var(--cor-secundaria);
            box-shadow: 0 0 0 3px rgba(41, 127, 184, 0.1);
        }

        .btn-white-big {
            width: 100%;
            background-color: #fff;
            border: 1px solid var(--cor-borda);
            border-radius: 8px;
            padding: 12px;
            font-weight: 700;
            color: #2c3e50;
            font-size: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-green-block {
            width: 100%;
            background-color: var(--cor-principal);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(39, 174, 97, 0.2);
        }

        .btn-green-block:active {
            transform: scale(0.98);
        }

        .btn-outline-red {
            width: 100%;
            border: 1px solid var(--cor-erro);
            color: var(--cor-erro);
            background: transparent;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            margin-top: 10px;
            cursor: pointer;
        }

        .action-buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }

        .btn-action-mode {
            background: #fff;
            border: 1px solid var(--cor-borda);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 50px;
            color: var(--cor-off);
        }

        .btn-action-mode.active {
            background-color: #eef6fc;
            border-color: var(--cor-secundaria);
            color: var(--cor-secundaria);
            font-weight: 600;
        }

        .btn-action-mode i {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .btn-action-mode span {
            font-size: 10px;
            text-transform: uppercase;
        }

        /* STEPS OTIMIZADOS PARA LEITURA RÁPIDA */
        .input-group-step {
            margin-bottom: 8px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 6px;
            opacity: 0.5;
            transition: all 0.2s;
        }

        .input-group-step.step-active {
            opacity: 1;
            border-color: var(--cor-principal);
            border-bottom-width: 2px;
        }

        .step-label {
            font-size: 11px;
            color: var(--cor-off);
            font-weight: 700;
            margin-bottom: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-transform: uppercase;
        }

        /* LISTA COMPACTA (UX GUARDA) */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 5px;
            margin-top: 15px;
        }

        /* Classe genérica base */
        .dashed-area {
            border: 1px dashed #ccc;
            border-radius: 6px;
            padding: 5px;
            background-color: #fafafa;
            min-height: 80px;
        }

        /* ESPECÍFICO PARA A LISTA DE ITENS (LIMITAÇÃO DE ALTURA E SCROLL) */
        #containerLista {
            /* Altura exata para 4 itens + paddings */
            max-height: 186px;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
            display: block;
            min-height: 148px;
            /* Mantém tamanho mínimo visual agradável */
        }

        /* Customização da barra de rolagem */
        #containerLista::-webkit-scrollbar {
            width: 4px;
        }

        #containerLista::-webkit-scrollbar-thumb {
            background-color: #ccc;
            border-radius: 4px;
        }

        .os-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            /* Padding lateral */
            border-radius: 4px;
            background: #fff;
            margin-bottom: 4px;
            border: 1px solid #e6e6e6;

            /* FIXAÇÃO DE ALTURA PARA SCROLL PERFEITO */
            height: 36px;
            min-height: 36px;
            flex-shrink: 0;
        }

        .os-item.current {
            background-color: #e8f8f5;
            border-left: 4px solid var(--cor-principal);
        }

        .os-left {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
        }

        .os-caixa {
            font-weight: 700;
            font-size: 13px;
            color: #2c3e50;
        }

        .os-status {
            font-size: 10px;
            color: #fff;
            background-color: var(--cor-secundaria);
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .os-time {
            display: none;
        }

        .btn-remove {
            background: transparent;
            border: none;
            color: #bbb;
            cursor: pointer;
            padding: 4px;
        }

        .btn-remove:hover {
            color: var(--cor-erro);
        }

        .timer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #e8f8f5;
            color: var(--cor-principal);
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 15px;
            border: 1px solid rgba(39, 174, 97, 0.2);
        }

        /* MENSAGENS E FEEDBACK */
        .msg-erro {
            display: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 10px;
            align-items: center;
            font-weight: 600;
            animation: shake 0.4s ease-in-out;
        }

        .erro-permissao {
            background-color: #fff5f5;
            color: var(--cor-erro);
            border: 1px solid #ffcccc;
        }

        .erro-leitura {
            background-color: #fff9db;
            color: #e67e22;
            border: 1px solid #ffe066;
        }

        .success-internal-container {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding-top: 40px;
        }

        .report-box {
            background: var(--cor-bg-item);
            border: 1px solid var(--cor-borda);
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            text-align: left;
            margin-bottom: 20px;
        }

        /* COMPONENTES DE OVERLAY */
        .lock-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--cor-off);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-box {
            background: #fff;
            width: 85%;
            max-width: 320px;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .bottom-sheet-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: flex-end;
            justify-content: center;
        }

        .bottom-sheet {
            background: #fff;
            width: 100%;
            max-width: 600px;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            padding: 25px;
            animation: slideUp 0.3s ease-out;
        }

        .bs-input {
            width: 100%;
            border: none;
            border-bottom: 2px solid var(--cor-borda);
            padding: 10px 0;
            font-size: 18px;
            outline: none;
            margin-bottom: 20px;
        }

        .bs-input:focus {
            border-bottom-color: var(--cor-principal);
        }

        .scanner-trap {
            position: absolute;
            opacity: 0;
            top: -1000px;
        }

        /* MOCKUP MOBILE CONTAINER */
        .mobile-mockup {
            width: 375px;
            height: 812px;
            background-color: #000;
            border-radius: 40px;
            box-shadow: 0 0 0 12px #1a1a1a, 0 30px 60px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        .status-bar-mockup {
            height: 44px;
            background-color: #f0f2f5;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            z-index: 10;
            padding-top: 10px;
        }

        .app-screen-content {
            flex: 1;
            background-color: var(--cor-bg-body);
            overflow-y: hidden;
            position: relative;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        /* ===============================
   MODO CELULAR REAL (RESPONSIVO)
   =============================== */
        @media (max-width: 768px) {

            body {
                background: var(--cor-bg-body);
                align-items: stretch;
                justify-content: stretch;
                overflow: hidden;
            }

            /* Remove o mockup */
            .mobile-mockup {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
                box-shadow: none;
                background: transparent;
            }

            /* Remove status bar fake */
            .status-bar-mockup {
                display: none;
            }

            /* App ocupa a tela toda */
            .app-screen-content {
                height: 100vh;
                overflow: hidden;
            }

            .work-card {
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <input type="text" id="scannerTrap" class="scanner-trap" autocomplete="off">

    <div class="mobile-mockup">

        <div class="status-bar-mockup">
            <span id="clock-mockup">09:41</span>
            <div style="display: flex; gap: 6px;">
                <i class="bi bi-wifi"></i>
                <i class="bi bi-battery-full"></i>
            </div>
        </div>

        <div class="app-screen-content">

            <div class="work-card" id="tela-login">
                <h4 style="margin-top: 20px;">Identificação</h4>
                <p style="font-size: 13px; color: var(--cor-off); margin-bottom: 20px;">
                    Bipe seu crachá.
                </p>

                <div id="msgErroLogin" class="msg-erro">
                    <i id="iconErroLogin" class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span id="txtErroLogin">Erro</span>
                </div>

                <div class="action-buttons-grid" id="loginButtonsGrid">
                    <div class="btn-action-mode active" onclick="setAuthMode('camera', this)">
                        <i class="bi bi-camera"></i> <span>Câmera</span>
                    </div>
                    <div class="btn-action-mode" onclick="setAuthMode('digitar', this)">
                        <i class="bi bi-keyboard"></i> <span>Digitar</span>
                    </div>
                    <div class="btn-action-mode" onclick="setAuthMode('leitor', this)">
                        <i class="bi bi-upc-scan"></i> <span>Leitor</span>
                    </div>
                </div>

                <div id="msgAguardandoLogin" class="dashed-area"
                    style="min-height: 80px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 15px;">
                    <i class="bi bi-qr-code-scan" style="font-size: 24px; color: var(--cor-secundaria);"></i>
                    <span style="margin-top: 10px;">Aguardando crachá...</span>
                </div>
            </div>

            <div class="work-card" id="tela-operacao" style="display: none;">

                <div class="segmented-progress-wrapper" id="progressWrapper">
                    <div class="segments-container">
                        <div class="segment active" id="seg1"></div>
                        <div class="segment" id="seg2"></div>
                        <div class="segment" id="seg3"></div>
                    </div>
                    <div class="progress-info">
                        <span class="step-name-display" id="stepNameDisplay">Localização</span>
                        <span class="step-counter" id="stepCounterDisplay">1/3</span>
                    </div>
                </div>

                <hr style="margin: 10px 0; border-top: 1px solid #eee;">

                <div class="timer-header">
                    <span><i class="bi bi-person-circle me-2"></i> <span id="lblOperador">OP01</span></span>
                    <span><span id="lblTimer">00:00</span></span>
                </div>

                <div id="msgErroOp" class="msg-erro">
                    <i class="bi bi-x-circle-fill me-2"></i> <span id="txtErroOp">Erro</span>
                </div>

                <div id="conteudo-formulario">
                    <div class="action-buttons-grid">
                        <div class="btn-action-mode active" id="btnOpCamera" onclick="setOpMode('camera', this)">
                            <i class="bi bi-camera"></i> <span>Câmera</span>
                        </div>
                        <div class="btn-action-mode" id="btnOpDigitar" onclick="setOpMode('digitar', this)">
                            <i class="bi bi-keyboard"></i> <span>Digitar</span>
                        </div>
                        <div class="btn-action-mode" id="btnOpLeitor" onclick="setOpMode('leitor', this)">
                            <i class="bi bi-upc-scan"></i> <span>Leitor</span>
                        </div>
                    </div>

                    <div style="margin-top: 15px;">
                        <div class="input-group-step step-active" id="step1">
                            <label class="step-label" id="lblStep1">
                                1. Localização
                                <i class="bi bi-check-circle-fill"
                                    style="color: var(--cor-principal); display: none;"></i>
                            </label>
                            <input type="hidden" id="inputLoc">
                        </div>

                        <div class="input-group-step" id="step2">
                            <label class="step-label" id="lblStep2">
                                2. Status
                                <i class="bi bi-check-circle-fill"
                                    style="color: var(--cor-principal); display: none;"></i>
                            </label>
                            <input type="hidden" id="inputStatus">
                        </div>

                        <div class="input-group-step" id="step3">
                            <label class="step-label" id="lblStep3">
                                3. Caixas / Itens
                                <i class="bi bi-check-circle-fill"
                                    style="color: var(--cor-principal); display: none;"></i>
                            </label>
                            <input type="hidden" id="inputCaixa">
                        </div>
                    </div>

                    <div class="list-header">
                        <span class="label-passo" style="font-size: 12px; margin: 0; font-weight: 700;">REGISTROS</span>
                        <span style="font-size: 11px; color: var(--cor-secundaria);" id="contadorItens">0</span>
                    </div>

                    <div class="dashed-area" id="containerLista">
                        <div id="msgVazio" style="text-align: center; margin-top: 40px; color: #ccc; font-size: 12px;">
                            Nenhum item bipado
                        </div>
                        <div id="listaConteudo" style="width: 100%; display: none;"></div>
                    </div>

                    <div style="display: flex; gap: 10px; margin-top: 15px;">
                        <button class="btn-outline-red" style="flex: 1; padding: 12px; font-size: 16px; margin-top: 0;"
                            onclick="limparLista()">Limpar</button>
                        <button class="btn-green-block" style="flex: 1; padding: 12px; font-size: 16px; margin-top: 0;"
                            onclick="finalizarOperacao()">Encerrar Operação</button>
                    </div>


                </div>

                <div id="conteudo-sucesso" class="success-internal-container">
                    <div
                        style="width: 70px; height: 70px; background: var(--cor-principal); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
                        <i class="bi bi-check-lg" style="font-size: 40px; color: white;"></i>
                    </div>
                    <h4 style="margin-bottom: 5px;">Lote Finalizado</h4>
                    <p style="font-size: 13px; color: var(--cor-off); margin-bottom: 20px;">
                        Operação concluída.
                    </p>

                    <div class="report-box">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span style="color: var(--cor-off); font-size: 13px;">Total Itens</span>
                            <strong id="resumoTotal" style="color: #333;">0</strong>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span style="color: var(--cor-off); font-size: 13px;">Tempo Total</span>
                            <strong id="resumoTempo" style="color: var(--cor-principal);">00:00</strong>
                        </div>
                    </div>

                    <button class="btn-white-big" onclick="location.reload()">Novo Lote</button>
                </div>

            </div>

        </div>

        <div id="modal-confirmacao" class="modal-overlay">
            <div class="modal-box">
                <i class="bi bi-person-badge-fill"
                    style="font-size: 32px; color: var(--cor-secundaria); margin-bottom: 10px;"></i>
                <h4 style="font-size: 16px; margin-bottom: 5px;">Confirmar Operador</h4>
                <div style="background: #f5f5f5; padding: 10px; border-radius: 6px; margin: 15px 0;">
                    <b id="modalNome" style="color: var(--cor-principal); font-size: 14px; display:block;">...</b>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-outline-red" onclick="cancelarLogin()"
                        style="margin: 0; border: none;">Cancelar</button>
                    <button class="btn-green-block" onclick="confirmarLogin()"
                        style="margin: 0; padding: 10px;">Iniciar</button>
                </div>
            </div>
        </div>

        <div id="bottomSheet" class="bottom-sheet-overlay">
            <div class="bottom-sheet">
                <span style="font-size: 14px; font-weight: 700; color: #333; display: block; margin-bottom: 12px;">
                    Entrada manual
                </span>

                <input type="text" id="bsInput" class="bs-input" autocomplete="off" placeholder="Digite o código..."
                    style="font-size: 15px; text-transform: uppercase;">

                <button class="btn-green-block" onclick="confirmarPopup()" style="margin-top: 5px;">OK</button>
            </div>
        </div>

    </div>

    <script>
        // --- CONFIGURAÇÃO DE ÁUDIO (ALTERADA) ---
        // SUCESSO: Usa beep.mp3
        const audioSuccess = new Audio("audio/beep.mp3");

        // ERRO/PERMISSÃO: Usa erro.mp3 para ambos
        const audioError = new Audio("audio/erro.mp3");

        // Função wrapper para áudio
        function playSound(type) {
            try {
                if (type === 'success') {
                    audioSuccess.currentTime = 0;
                    audioSuccess.play().catch(() => console.log('Autoplay blocked'));
                } else if (type === 'error' || type === 'denied') {
                    // Toca som de erro para erros e acessos negados
                    audioError.currentTime = 0;
                    audioError.play().catch(() => console.log('Autoplay blocked'));
                }
            } catch (e) {
                console.error("Erro ao tocar áudio", e);
            }
        }

        // --- ESTADO GLOBAL ---
        let listaItens = [];
        let startTime = null; // Regra 2: Apenas startTime e endTime
        let timerInterval = null;
        let passoAtual = 1;
        let currentUser = null;

        const MOCK_DB = [
            { id: "1234", nome: "LUCAS SANTOS" },
            { id: "ADMIN", nome: "SUPERVISOR" }
        ];

        // Elementos DOM
        const scannerTrap = document.getElementById('scannerTrap');
        const bottomSheet = document.getElementById('bottomSheet');
        const bsInput = document.getElementById('bsInput');
        const contadorItens = document.getElementById('contadorItens');

        // Inicialização
        window.onload = () => {
            setInterval(updateClockMockup, 1000);
            scannerTrap.focus();
            document.addEventListener('click', () => scannerTrap.focus());
        };

        function updateClockMockup() {
            const now = new Date();
            document.getElementById('clock-mockup').innerText =
                String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        }

        // --- CAPTURA DE LEITURA (Regra 1: Tempo Real) ---
        scannerTrap.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const val = scannerTrap.value.trim().toUpperCase();
                scannerTrap.value = '';
                if (!val) return;

                if (document.getElementById('tela-login').offsetParent) {
                    tryLogin(val);
                } else if (document.getElementById('tela-operacao').offsetParent) {
                    processScan(val);
                }
            }
        });

        // --- LÓGICA DE LOGIN ---
        function tryLogin(code) {
            const user = MOCK_DB.find(u => u.id === code || u.id === 'ADMIN');
            if (user) {
                currentUser = user;
                playSound('success');
                document.getElementById('modalNome').innerText = user.nome;
                document.getElementById('modal-confirmacao').style.display = 'flex';
            } else {
                playSound('denied');
                mostrarErro('login', 'Crachá não encontrado', 'permissao');
            }
        }

        function confirmarLogin() {
            document.getElementById('modal-confirmacao').style.display = 'none';
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('tela-operacao').style.display = 'block';

            document.getElementById('lblOperador').innerText = currentUser.nome.split(' ')[0];

            // Regra 2: Marca início da operação
            startTime = new Date();
            iniciarTimerVisual();

            scannerTrap.focus();
        }

        function cancelarLogin() {
            document.getElementById('modal-confirmacao').style.display = 'none';
            scannerTrap.focus();
        }

        // --- LÓGICA OPERACIONAL ---
        function iniciarTimerVisual() {
            const elTimer = document.getElementById('lblTimer');
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const now = new Date();
                const diff = Math.floor((now - startTime) / 1000);
                const m = Math.floor(diff / 60);
                const s = diff % 60;
                elTimer.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }, 1000);
        }

        function processScan(code) {
            if (code.length < 2) {
                playSound('error');
                mostrarErro('op', 'Código Inválido', 'leitura');
                return;
            }

            // PASSO 1 – Localização
            if (passoAtual === 1) {
                playSound('success');
                document.getElementById('inputLoc').value = code;
                document.getElementById('lblStep1').innerHTML =
                    `1. LOC: <span style="color:var(--cor-secundaria)">${code}</span>
             <i class="bi bi-check-circle-fill" style="color: var(--cor-principal);"></i>`;
                mudarPasso(2);
                return;
            }

            // PASSO 2 – Status
            if (passoAtual === 2) {
                playSound('success');
                document.getElementById('inputStatus').value = code;
                document.getElementById('lblStep2').innerHTML =
                    `2. STS: <span style="color:var(--cor-secundaria)">${code}</span>
             <i class="bi bi-check-circle-fill" style="color: var(--cor-principal);"></i>`;
                mudarPasso(3);
                return;
            }

            // PASSO 3 – Caixas
            // Aqui o som é controlado SOMENTE dentro de adicionarCaixa()
            if (passoAtual === 3) {
                adicionarCaixa(code);
            }
        }

        function mudarPasso(novoPasso) {
            document.querySelectorAll('.input-group-step').forEach(el => el.classList.remove('step-active'));
            document.querySelectorAll('.segment').forEach(el => el.classList.remove('active', 'completed'));

            passoAtual = novoPasso;

            if (novoPasso === 2) {
                document.getElementById('step2').classList.add('step-active');
                document.getElementById('seg1').classList.add('completed');
                document.getElementById('seg2').classList.add('active');
                document.getElementById('stepNameDisplay').innerText = "STATUS";
                document.getElementById('stepCounterDisplay').innerText = "2/3";
            } else if (novoPasso === 3) {
                document.getElementById('step3').classList.add('step-active');
                document.getElementById('seg1').classList.add('completed');
                document.getElementById('seg2').classList.add('completed');
                document.getElementById('seg3').classList.add('active');
                document.getElementById('stepNameDisplay').innerText = "BIPAGEM";
                document.getElementById('stepCounterDisplay').innerText = "3/3";
            }
        }

        function adicionarCaixa(codigoCaixa) {
            if (!codigoCaixa) return;

            const existe = listaItens.find(i => i.caixa === codigoCaixa);
            if (existe) {
                playSound('error');
                mostrarErro('op', 'Caixa já bipada', 'leitura');
                return;
            }

            const item = {
                caixa: codigoCaixa,
                status: document.getElementById('inputStatus').value,
                loc: document.getElementById('inputLoc').value,
                timestamp: new Date()
            };

            listaItens.push(item);
            renderizarLista();
            playSound('success');
        }



        function renderizarLista() {
            const divConteudo = document.getElementById('listaConteudo');
            const msgVazio = document.getElementById('msgVazio');
            const container = document.getElementById('containerLista');

            contadorItens.innerText = listaItens.length;

            if (listaItens.length === 0) {
                msgVazio.style.display = 'block';
                divConteudo.style.display = 'none';
                return;
            }

            msgVazio.style.display = 'none';
            divConteudo.style.display = 'block';

            let html = '';
            listaItens.forEach((item, index) => {
                const isLast = index === listaItens.length - 1;
                html += `
        <div class="os-item ${isLast ? 'current' : ''}" style="height:36px;">
            <div class="os-left">
                <span class="os-caixa">${item.caixa}</span>
                <span class="os-status">${item.status}</span>
            </div>
            <button class="btn-remove" onclick="removerItem(${index})"><i class="bi bi-x-lg"></i></button>
        </div>
    `;
            });
            divConteudo.innerHTML = html;

            // Scroll automático apenas se lista tiver mais de 4 itens
            if (listaItens.length > 4) {
                setTimeout(() => { container.scrollTop = container.scrollHeight; }, 50);
            }
        }



        function removerItem(index) {
            listaItens.splice(index, 1);
            renderizarLista(); // Atualiza lista sem som
            scannerTrap.focus();
        }


        function limparLista() {
            listaItens = [];
            contadorItens.innerText = 0;

            document.getElementById('listaConteudo').innerHTML = '';
            document.getElementById('msgVazio').style.display = 'block';

            passoAtual = 1;
            document.getElementById('inputLoc').value = '';
            document.getElementById('inputStatus').value = '';
            document.getElementById('inputCaixa').value = '';

            scannerTrap.focus();
        }



        function finalizarOperacao() {
            if (listaItens.length === 0) {
                mostrarErro('op', 'Bipe ao menos 1 item', 'leitura');
                playSound('error');
                return;
            }

            clearInterval(timerInterval);
            const endTime = new Date();
            const totalSeconds = Math.floor((endTime - startTime) / 1000);
            const m = Math.floor(totalSeconds / 60);
            const s = totalSeconds % 60;
            const timeStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

            document.getElementById('conteudo-formulario').style.display = 'none';
            document.querySelector('.timer-header').style.display = 'none';
            document.getElementById('conteudo-sucesso').style.display = 'flex';
            document.getElementById('resumoTotal').innerText = listaItens.length;
            document.getElementById('resumoTempo').innerText = timeStr;

            passoAtual = 1;
            document.getElementById('inputLoc').value = '';
            document.getElementById('inputStatus').value = '';
            document.getElementById('inputCaixa').value = '';
        }


        // --- UTILITÁRIOS UI ---
        function mostrarErro(contexto, msg, tipo) {
            const el = contexto === 'login' ? document.getElementById('msgErroLogin') : document.getElementById('msgErroOp');
            const txt = contexto === 'login' ? document.getElementById('txtErroLogin') : document.getElementById('txtErroOp');

            el.className = 'msg-erro ' + (tipo === 'permissao' ? 'erro-permissao' : 'erro-leitura');
            el.style.display = 'flex';
            txt.innerText = msg;

            setTimeout(() => { el.style.display = 'none'; }, 2500);
        }

        function setAuthMode(mode, btn) {
            document.querySelectorAll('#loginButtonsGrid .btn-action-mode').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            if (mode === 'digitar') {
                ativarInputManual(btn);
            } else {
                scannerTrap.focus();
            }
        }


        function setOpMode(mode, btn) {
            document.querySelectorAll('#conteudo-formulario .btn-action-mode').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            if (mode === 'digitar') {
                ativarInputManual(btn);
            } else {
                scannerTrap.focus();
            }
        }



        function ativarInputManual(btn) {
            document.querySelectorAll('.btn-action-mode').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            bottomSheet.style.display = 'flex';
            bsInput.value = '';
            setTimeout(() => bsInput.focus(), 100);
        }

        function confirmarPopup() {
            const val = bsInput.value.trim().toUpperCase();
            if (!val) return;
            bottomSheet.style.display = 'none';
            if (document.getElementById('tela-login').offsetParent) tryLogin(val);
            else processScan(val);
            scannerTrap.focus();
        }


        bsInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') confirmarPopup();
        });

        bottomSheet.addEventListener('click', (e) => {
            if (e.target === bottomSheet) {
                bottomSheet.style.display = 'none';
                scannerTrap.focus();
            }
        });

    </script>

</body>

</html>
